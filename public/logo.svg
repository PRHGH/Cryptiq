<svg width="1024" height="1024" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Minimal atmospheric glow - reduced from 8% to 4% -->
    <radialGradient id="elite-ambient" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#8BCF7B" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#8BCF7B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Extremely subtle ambient glow -->
  <rect width="64" height="64" rx="11" fill="url(#elite-ambient)" />

  <!-- Refined ring - reduced thickness -->
  <path
    d="M 32 15 C 23.222 15 16 22.222 16 31 C 16 39.778 23.222 47 32 47 C 35.979 47 39.59 45.525 42.285 43.03"
    stroke="#8BCF7B"
    stroke-width="2.4"
