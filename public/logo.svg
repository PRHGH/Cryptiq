    d="M 41 41 C 41 40.5 41.4 40.1 41.9 40.1 L 43.6 40.1 C 44.1 40.1 44.5 40.5 44.5 41 L 44.5 47.4 C 44.5 47.9 44.25 48.3 43.9 48.3 L 42.1 48.3 C 41.75 48.3 41.5 47.9 41.5 47.4 L 41 41 Z"
